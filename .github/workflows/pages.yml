# Builds the website with fresh catalog data and deploys it to GitHub Pages.
name: Website

on:
  push:
    branches: [main]
  schedule:
    # Mon-Fri 05:17 UTC. Sat 05:17 and Sun 05:17 UTC fall inside the Shabbat
    # union (Sun 05:17 is still before the PST end at 05:30). LS-126.
    - cron: "17 5 * * 1-5" # weekdays, so the live demo knows about new models
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  shabbat-guard:
    uses: ./.github/workflows/shabbat-guard.yml

  build:
    needs: shabbat-guard
    if: needs.shabbat-guard.outputs.proceed == 'true'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')) &&
        'ubuntu-latest' ||
        fromJSON(vars.RUNNER_FLEET_LABELS || '["ubuntu-latest"]')
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Build site
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: uv run python scripts/build_site.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
