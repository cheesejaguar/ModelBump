# Refreshes the bundled OpenRouter snapshot used when ModelBump runs offline,
# and opens a pull request when it changed.
name: Refresh bundled catalog

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')) &&
        'ubuntu-latest' ||
        fromJSON(vars.RUNNER_FLEET_LABELS || '["ubuntu-latest"]')
      }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run python scripts/refresh_snapshot.py
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Snapshot unchanged."; exit 0; fi
          branch=catalog/refresh-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -qam "Refresh bundled OpenRouter model snapshot"
          git push -qf origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --title "Refresh bundled OpenRouter model snapshot" \
              --body "Weekly refresh of \`src/modelbump/data/openrouter_snapshot.json\`, used when ModelBump runs offline or OpenRouter is unreachable."
          fi
