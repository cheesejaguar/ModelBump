# Copy to .github/workflows/modelbump.yml in the repository you want kept up to date.
# Also enable Settings -> Actions -> General -> "Allow GitHub Actions to create
# and approve pull requests".
name: ModelBump

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  modelbump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cheesejaguar/ModelBump@v0
        env:
          # All optional. Without them ModelBump still works from OpenRouter's
          # public catalog, but cost-optimized mode needs benchmark scores.
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
