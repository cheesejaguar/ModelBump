# Curated model slugs that the live OpenRouter catalog cannot supply:
# first-party Anthropic ids (aliases and dated snapshots), Amazon Bedrock and
# Google Vertex AI ids, pinned OpenAI/Google snapshots, and lifecycle status.
# Vertex AI serves Claude 4.6 and later under the bare first-party id and older
# models under an @-dated id; both are listed under "vertex".
#
# Pricing is USD per million tokens and is only a fallback: live OpenRouter
# pricing wins when it exists. Status "retired"/"deprecated" marks a model as a
# source to move away from; such models are never chosen as bump targets.
# A "retires" date in the past is treated as retired.
#
# Last reviewed: 2026-10-15.

