name: ModelBump
description: Dependabot-style pull requests that bump hard-coded LLM model slugs
author: cheesejaguar
branding:
  icon: arrow-up-circle
  color: purple

inputs:
  command:
    description: "pr (open or refresh pull requests), plan (report only) or apply (edit the checkout)"
    default: pr
  path:
    description: Directory to scan, relative to the repository root (for monorepos)
    default: "."
  config:
    description: Config file path (default .github/modelbump.yml when present)
    default: ""
  strategy:
    description: Override the strategy for every path (same-family or cost-optimized)
    default: ""
  base:
    description: Base branch for pull requests (default the checked-out branch)
    default: ""
  fail-on-updates:
    description: With command plan, fail the step when updates are available (use as a CI check)
    default: "false"
  annotations:
    description: Annotate changed lines in the workflow run and pull request diff
    default: "true"
  github-token:
    description: >-
      Token for gh. Pull requests opened with the default GITHUB_TOKEN do not
      trigger other workflows; pass a GitHub App or fine-grained token if your
      CI should run on them.
    default: ${{ github.token }}

outputs:
  updates:
    description: Number of slug replacements proposed
    value: ${{ steps.run.outputs.updates }}
  pull-requests:
    description: JSON array of pull requests created, updated or skipped (command pr)
    value: ${{ steps.run.outputs.pull-requests }}
  report:
    description: Path to the full JSON report
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Check for Python 3.10+
      id: python
      shell: bash
      run: |
        if command -v python3 >/dev/null && python3 -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      if: steps.python.outputs.found != 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install ModelBump
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # A private virtualenv, so the job's own Python environment is untouched.
        venv="$RUNNER_TEMP/modelbump-venv"
        python3 -m venv "$venv"
        "$venv/bin/python" -m pip install --quiet --disable-pip-version-check "${ACTION_PATH}[anthropic]"
        echo "MODELBUMP_BIN=$venv/bin/modelbump" >> "$GITHUB_ENV"

    - name: Run ModelBump
      id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MB_COMMAND: ${{ inputs.command }}
        MB_PATH: ${{ inputs.path }}
        MB_CONFIG: ${{ inputs.config }}
        MB_STRATEGY: ${{ inputs.strategy }}
        MB_BASE: ${{ inputs.base }}
        MB_FAIL: ${{ inputs.fail-on-updates }}
        MB_ANNOTATE: ${{ inputs.annotations }}
      run: |
        set -euo pipefail
        case "$MB_COMMAND" in
          pr|plan|apply) ;;
          *) echo "::error title=ModelBump::command must be pr, plan or apply (got '$MB_COMMAND')"; exit 1 ;;
        esac
        report="$RUNNER_TEMP/modelbump-report.json"
        args=("$MB_COMMAND" -C "$MB_PATH" --summary "$GITHUB_STEP_SUMMARY" --report-json "$report")
        if [ -n "$MB_CONFIG" ]; then args+=(--config "$MB_CONFIG"); fi
        if [ -n "$MB_STRATEGY" ]; then args+=(--strategy "$MB_STRATEGY"); fi
        if [ "$MB_ANNOTATE" = "true" ]; then args+=(--github-annotations); fi
        if [ "$MB_COMMAND" = "plan" ] && [ "$MB_FAIL" = "true" ]; then args+=(--fail-on-updates); fi
        if [ "$MB_COMMAND" = "pr" ]; then
          if [ -n "$MB_BASE" ]; then args+=(--base "$MB_BASE"); fi
          git config user.name >/dev/null || git config user.name "github-actions[bot]"
          git config user.email >/dev/null || git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Comparing with existing ModelBump branches needs history.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then git fetch --quiet --unshallow; fi
        fi

        status=0
        "$MODELBUMP_BIN" "${args[@]}" || status=$?

        if [ -f "$report" ]; then
          echo "report=$report" >> "$GITHUB_OUTPUT"
          python3 - "$report" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        r = json.load(open(sys.argv[1]))
        print(f"updates={len(r['changes'])}")
        print(f"pull-requests={json.dumps(r.get('pull_requests', []))}")
        PY
        fi
        exit $status
