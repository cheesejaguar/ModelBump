name: ModelBump
description: Dependabot-style pull requests that bump hard-coded LLM model slugs
author: cheesejaguar
branding:
  icon: arrow-up-circle
  color: purple

inputs:
  command:
    description: "pr (open or refresh pull requests), plan (report only) or apply (edit the checkout)"
    default: pr
  config:
    description: Config file path (default .github/modelbump.yml when present)
    default: ""
  strategy:
    description: Override the strategy for every path (same-family or cost-optimized)
    default: ""
  base:
    description: Base branch for pull requests (default the checked-out branch)
    default: ""
  github-token:
    description: >-
      Token for gh. Pull requests opened with the default GITHUB_TOKEN do not
      trigger other workflows; pass a GitHub App or fine-grained token if your
      CI should run on them.
    default: ${{ github.token }}
  python-version:
    description: Python used to run ModelBump
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install ModelBump
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "${ACTION_PATH}[anthropic]"

    - name: Run ModelBump
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MB_COMMAND: ${{ inputs.command }}
        MB_CONFIG: ${{ inputs.config }}
        MB_STRATEGY: ${{ inputs.strategy }}
        MB_BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        git config user.name >/dev/null || git config user.name "github-actions[bot]"
        git config user.email >/dev/null || git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        args=("$MB_COMMAND")
        if [ -n "$MB_CONFIG" ]; then args+=(--config "$MB_CONFIG"); fi
        if [ -n "$MB_STRATEGY" ]; then args+=(--strategy "$MB_STRATEGY"); fi
        if [ -n "$MB_BASE" ] && [ "$MB_COMMAND" = "pr" ]; then args+=(--base "$MB_BASE"); fi
        modelbump "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
